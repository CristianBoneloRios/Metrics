<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CODSP Static Metrics</title>
  <style>
    :root {
      --bg: #0b1220;
      --card: #111a2d;
      --text: #e5ecff;
      --muted: #9fb0d6;
      --accent: #3ddc97;
      --link: #79b8ff;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 24px;
      background: radial-gradient(circle at 20% 0%, #1a2440 0%, var(--bg) 50%);
      color: var(--text);
      font-family: Segoe UI, Tahoma, sans-serif;
    }
    .card {
      width: min(760px, 92vw);
      background: var(--card);
      border: 1px solid #22355e;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
    }
    h1 {
      margin: 0 0 10px;
      font-size: 1.6rem;
    }
    p {
      color: var(--muted);
      line-height: 1.5;
    }
    .ok {
      color: var(--accent);
      font-weight: 700;
    }
    a {
      color: var(--link);
    }
    code {
      background: #0b1325;
      border: 1px solid #22355e;
      border-radius: 8px;
      padding: 2px 6px;
      color: #d8e4ff;
    }
    footer {
      font-size: 0.85rem;
      color: var(--muted);
      text-align: center;
      opacity: 0.9;
    }
    footer strong {
      color: var(--text);
    }
  </style>
</head>
<body>

  <main class="card">
    <h1>CODSP Static Metrics Endpoint</h1>
    <p class="ok">GitHub Pages is active.</p>
    <p>
      Prometheus metrics file:
      <a href="./metrics.prom">metrics.prom</a>
    </p>
    <p>
      URL expected for CODSP registration:
      <code>/Metrics/metrics.prom</code>
    </p>
  </main>

  <footer>
    POWERED BY <strong>Cristian Bonelo</strong> — SOFTWARE QUALITY ANALYST<br>
    DEVELOPMENT &amp; INNOVATION
  </footer>

</body>
</html>
